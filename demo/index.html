<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>投資1年目の教科書 デモ版</title>
    <style>
      :root{
        --bg:#08080a;
        --bg2:#0e0e11;
        --panel:#151517;
        --panel2:#1c1c20;
        --line:rgba(216,178,90,.32);
        --line-soft:rgba(216,178,90,.16);
        --gold:#d8b25a;
        --gold-hi:#f6e2a0;
        --gold-lo:#9a7420;
        --ink:#f4eedd;
        --muted:#b3a98f;
        --faint:#8a8271;
        --green:#57d98d;
        --red:#f2836b;
        --radius:14px;
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0;
        background:
          radial-gradient(1200px 500px at 50% -180px, rgba(216,178,90,.10), transparent 60%),
          linear-gradient(180deg, var(--bg2), var(--bg) 320px);
        color:var(--ink);
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
        line-height:1.65;
        min-height:100vh;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]){ min-height:2.5rem; }
      button{ font-family:inherit; cursor:pointer; }
      .num{ font-variant-numeric:tabular-nums; letter-spacing:.01em; }

      /* ---------- asset bar ---------- */
      .assetbar{
        position:sticky; top:0; z-index:50;
        background:linear-gradient(180deg, rgba(24,24,20,.97), rgba(12,12,13,.97));
        border-bottom:1px solid var(--line);
        backdrop-filter:blur(6px);
        padding:.55rem .9rem .6rem;
      }
      .assetbar-inner{ max-width:1060px; margin:0 auto; display:flex; align-items:flex-end; gap:1.1rem; flex-wrap:wrap; }
      .ab-item{ min-width:0; }
      .ab-label{ font-size:.68rem; color:var(--muted); letter-spacing:.08em; white-space:nowrap; }
      .ab-total{ font-size:clamp(1.45rem,4.6vw,2rem); font-weight:900; color:var(--gold-hi); line-height:1.15; text-shadow:0 0 18px rgba(216,178,90,.35); white-space:nowrap; }
      .ab-usd{ font-size:.85rem; color:var(--muted); font-weight:500; margin-left:.35rem; }
      .ab-val{ font-size:clamp(.95rem,3vw,1.1rem); font-weight:700; white-space:nowrap; }
      .ab-status{ font-size:.8rem; color:var(--gold); font-weight:700; white-space:nowrap; padding-bottom:.2rem; }
      .ab-spacer{ flex:1; }
      .lang-btn{
        border:1px solid var(--line); background:linear-gradient(180deg,#26241c,#171713);
        color:var(--gold-hi); border-radius:999px; padding:.35rem .95rem;
        font-weight:700; font-size:.85rem; min-height:2.5rem;
      }
      .pnl-pos{ color:var(--green); } .pnl-neg{ color:var(--red); }

      main{ max-width:1060px; margin:0 auto; padding:1.2rem .95rem 3rem; }

      /* ---------- generic ---------- */
      .card{
        background:linear-gradient(180deg, var(--panel2), var(--panel));
        border:1px solid var(--line-soft);
        border-radius:var(--radius);
        padding:1.15rem 1.2rem;
        margin-bottom:1rem;
      }
      .card.gold{ border-color:var(--line); box-shadow:0 0 0 1px rgba(216,178,90,.08), 0 12px 32px rgba(0,0,0,.45); }
      h1,h2,h3{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; margin:0; }
      .btn{
        display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
        border-radius:12px; border:1px solid var(--line);
        background:linear-gradient(180deg,#2a2718,#1a1913);
        color:var(--gold-hi); font-weight:700; font-size:.95rem;
        padding:.6rem 1.2rem; min-height:2.75rem; text-decoration:none;
      }
      .btn.primary{
        background:linear-gradient(180deg,#ffe9ad 0%, #eec96e 45%, #c49a35 100%);
        color:#241a02; border-color:#8a6a1c;
        box-shadow:0 6px 18px rgba(216,178,90,.28), inset 0 1px 0 rgba(255,255,255,.65);
        font-size:1.05rem; padding:.8rem 1.6rem; width:100%;
      }
      .btn.ghost{ background:transparent; color:var(--muted); border-color:rgba(255,255,255,.16); font-weight:500; }
      .btn.danger{ color:var(--red); border-color:rgba(242,131,107,.4); background:transparent; }
      .btn:disabled{ opacity:.42; cursor:not-allowed; }
      .btn-row{ display:flex; gap:.6rem; flex-wrap:wrap; }
      .muted{ color:var(--muted); } .small{ font-size:.83rem; }
      .gold-text{ color:var(--gold); }

      /* ---------- home ---------- */
      .hero{ text-align:center; padding:1.6rem .5rem .4rem; }
      .demo-badge{
        display:inline-block; border:1px solid var(--line); color:var(--gold-hi);
        border-radius:999px; padding:.15rem .9rem; font-size:.8rem; font-weight:700; letter-spacing:.14em;
        background:rgba(216,178,90,.08);
      }
      .game-title{ font-size:clamp(1.9rem,6.5vw,3rem); font-weight:800; color:var(--gold-hi); margin:.7rem 0 .1rem; text-shadow:0 0 26px rgba(216,178,90,.3); }
      .game-sub{ font-family:"Hiragino Mincho ProN","Yu Mincho",serif; color:var(--muted); font-size:clamp(.95rem,3vw,1.15rem); letter-spacing:.06em; }
      .howto{ display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; margin:1rem 0; }
      .howto .step{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:.85rem .9rem; }
      .howto .n{ font-family:"Hiragino Mincho ProN","Yu Mincho",serif; color:var(--gold); font-size:1.3rem; font-weight:800; }
      .howto p{ margin:.25rem 0 0; font-size:.86rem; color:var(--muted); }
      @media (max-width:640px){ .howto{ grid-template-columns:1fr; } }
      .scenario-head{ color:var(--gold); font-size:.82rem; font-weight:700; letter-spacing:.05em; }
      .scenario-title{ font-size:1.45rem; font-weight:800; margin:.25rem 0 .4rem; }
      .tag{ display:inline-block; font-size:.72rem; border:1px solid var(--line-soft); color:var(--muted); border-radius:999px; padding:.05rem .6rem; margin-right:.35rem; }

      /* ---------- sectors ---------- */
      .sector-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.7rem; }
      .sector-opt{
        text-align:left; width:100%; border:1px solid var(--line-soft); border-radius:var(--radius);
        background:var(--panel); color:var(--ink); padding:.95rem 1rem; font-size:1rem; font-weight:700;
      }
      .sector-opt[aria-checked="true"]{ border-color:var(--gold); background:linear-gradient(180deg, rgba(216,178,90,.16), rgba(216,178,90,.05)); color:var(--gold-hi); box-shadow:0 0 0 1px var(--line); }
      .sector-opt .en{ display:block; font-size:.75rem; color:var(--muted); font-weight:500; margin-top:.15rem; }

      /* ---------- play ---------- */
      .round-label{ color:var(--gold); font-weight:700; font-size:.85rem; letter-spacing:.08em; }
      .news-head{ font-size:clamp(1.25rem,4.5vw,1.6rem); font-weight:800; line-height:1.45; margin:.3rem 0 .2rem; }
      .chart-title{ font-size:.9rem; color:var(--muted); margin-bottom:.3rem; }
      .chart-wrap{ background:#0b0b0d; border:1px solid var(--line-soft); border-radius:10px; padding:.6rem .4rem .2rem; }
      .price-now{ font-size:1.05rem; font-weight:700; }
      .seg{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:.55rem; margin:.4rem 0 .2rem; }
      .seg button{
        border-radius:12px; border:1px solid var(--line-soft); background:var(--panel);
        color:var(--ink); font-size:1.05rem; font-weight:800; padding:.7rem .3rem;
      }
      .seg button[aria-pressed="true"]{ border-color:var(--gold); color:#241a02; background:linear-gradient(180deg,#ffe9ad,#d9ae4e); box-shadow:0 4px 14px rgba(216,178,90,.3); }
      .amount-grid{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.45rem 0; }
      .amount-grid button{
        border-radius:10px; border:1px solid var(--line-soft); background:var(--panel2);
        color:var(--ink); font-weight:700; padding:.5rem .85rem; font-size:.95rem;
      }
      .amount-grid button[aria-pressed="true"]{ border-color:var(--gold); color:var(--gold-hi); background:rgba(216,178,90,.14); }
      .amount-grid button:disabled{ opacity:.35; cursor:not-allowed; }
      .warn{ color:var(--red); font-size:.85rem; font-weight:700; }
      .radio-list{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.4rem 0; }
      .radio-chip{
        display:inline-flex; align-items:center; gap:.45rem; border:1px solid var(--line-soft);
        border-radius:999px; padding:.5rem .95rem; min-height:2.5rem; cursor:pointer; background:var(--panel);
        font-size:.92rem; font-weight:500;
      }
      .radio-chip:has(input:checked){ border-color:var(--gold); color:var(--gold-hi); background:rgba(216,178,90,.13); font-weight:700; }
      .radio-chip input{ accent-color:var(--gold); width:1.05rem; height:1.05rem; }
      details.adv{ border:1px solid var(--line-soft); border-radius:10px; padding:.4rem .9rem .8rem; margin:.7rem 0; background:rgba(255,255,255,.02); }
      details.adv summary{ cursor:pointer; color:var(--muted); font-size:.88rem; padding:.35rem 0; }
      details.adv input[type="number"]{
        width:7rem; background:#0b0b0d; border:1px solid var(--line-soft); border-radius:8px;
        color:var(--ink); padding:.45rem .6rem; font-size:1rem;
      }
      .exec-box{ border:1px solid var(--line); border-radius:var(--radius); padding:1rem 1.1rem; background:linear-gradient(180deg, rgba(216,178,90,.10), rgba(216,178,90,.03)); margin-bottom:1rem; }
      .kv{ display:flex; justify-content:space-between; gap:1rem; padding:.28rem 0; border-bottom:1px dashed rgba(255,255,255,.08); font-size:.94rem; }
      .kv:last-child{ border-bottom:none; }
      .kv b{ text-align:right; }

      /* ---------- result ---------- */
      .result-hero{ text-align:center; }
      .result-pnl{ font-size:clamp(1.7rem,6vw,2.4rem); font-weight:900; line-height:1.2; }
      .result-total{ font-size:1.15rem; font-weight:700; color:var(--gold-hi); }
      .bars{ margin:.6rem 0 .2rem; }
      .bar-row{ display:grid; grid-template-columns:9.5rem 1fr 6.2rem; align-items:center; gap:.6rem; margin:.45rem 0; font-size:.88rem; }
      .bar-track{ background:#0b0b0d; border:1px solid var(--line-soft); border-radius:6px; height:1.15rem; overflow:hidden; }
      .bar-fill{ height:100%; border-radius:5px; background:linear-gradient(90deg,#8a6a1c,#d8b25a); }
      .bar-fill.you{ background:linear-gradient(90deg,#c49a35,#ffe9ad); }
      .bar-fill.best{ background:linear-gradient(90deg,#2f7a4d,#57d98d); }
      .bar-fill.worst{ background:linear-gradient(90deg,#8a3a2a,#f2836b); }
      .bar-val{ text-align:right; font-weight:700; }
      @media (max-width:560px){ .bar-row{ grid-template-columns:7.2rem 1fr 5.4rem; font-size:.8rem; } }
      .log-list{ list-style:none; margin:0; padding:0; }
      .log-list li{ padding:.55rem 0; border-bottom:1px dashed rgba(255,255,255,.08); font-size:.9rem; }
      .log-list li:last-child{ border-bottom:none; }
      .promo{
        border:1px solid var(--gold); border-radius:var(--radius);
        background:linear-gradient(180deg, rgba(216,178,90,.16), rgba(216,178,90,.05));
        padding:1.2rem 1.25rem; margin:1.2rem 0 1rem; text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,.4);
      }
      .promo .p-title{ font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-weight:800; color:var(--gold-hi); font-size:1.1rem; margin-bottom:.35rem; }
      footer{ border-top:1px solid var(--line-soft); margin-top:2rem; padding:1.1rem .2rem .5rem; text-align:center; color:var(--faint); font-size:.82rem; }
      .modal-back{ position:fixed; inset:0; background:rgba(0,0,0,.66); display:flex; align-items:center; justify-content:center; z-index:80; padding:1rem; }
      .modal{ background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:1.3rem; max-width:26rem; width:100%; }
      [hidden]{ display:none !important; }
    </style>
  </head>
  <body>
    <header class="assetbar">
      <div class="assetbar-inner">
        <div class="ab-item">
          <div class="ab-label" id="ab-total-label">総資産</div>
          <div class="ab-total num"><span id="ab-total">¥1,000,000</span><span class="ab-usd num" id="ab-total-usd">$6,250.00</span></div>
        </div>
        <div class="ab-item">
          <div class="ab-label" id="ab-cash-label">現金</div>
          <div class="ab-val num" id="ab-cash">¥1,000,000</div>
        </div>
        <div class="ab-item">
          <div class="ab-label" id="ab-stock-label">保有株の評価額</div>
          <div class="ab-val num" id="ab-stock">¥0</div>
        </div>
        <div class="ab-item">
          <div class="ab-label" id="ab-pnl-label">損益</div>
          <div class="ab-val num" id="ab-pnl">—</div>
        </div>
        <div class="ab-item ab-status" id="ab-status"></div>
        <div class="ab-spacer"></div>
        <button type="button" class="lang-btn" id="lang-btn" aria-label="Switch language">🌐 EN</button>
      </div>
    </header>

    <main id="app"></main>

    <footer>
      <div>企画：12/2 RR『金融・経済』</div>
    </footer>

    <div class="modal-back" id="reset-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
        <h3 id="reset-title" style="margin-bottom:.5rem;">リセットしますか？</h3>
        <p class="muted small" id="reset-body">進行中のデモの記録を消して、最初からやり直します。</p>
        <div class="btn-row" style="margin-top:1rem;">
          <button type="button" class="btn danger" id="reset-yes">リセットする</button>
          <button type="button" class="btn ghost" id="reset-no">キャンセル</button>
        </div>
      </div>
    </div>

    <script id="game-core">
"use strict";
/* Pure game logic for the demo scenarios (no DOM access) — also used by offline verification. */
var GAME_CORE = (function () {
  var START_TOTAL = 1000000;
  var BASE_PRICE = 1000;
  var UNIT = 100000;
  var MAX_TRADE = 500000;
  var FX_RATE = 160;
  var SAVE_KEY = "timeslip-invest-save-demo";

  var SECTORS = [
    { id: "bank",         ja: "銀行・金融",     en: "Banks & Financial Services" },
    { id: "auto",         ja: "自動車・製造業", en: "Autos & Manufacturing" },
    { id: "staples",      ja: "生活必需品",     en: "Consumer Staples" },
    { id: "construction", ja: "建設・インフラ", en: "Construction & Infrastructure" },
    { id: "retail",       ja: "小売・流通",     en: "Retail & Distribution" }
  ];

  var SCENARIOS = [
    {
      id: "ai",
      short: { ja: "NVIDIAとAIブーム", en: "NVIDIA & the AI Boom" },
      title: { ja: "デモシナリオ：NVIDIAとAIブーム", en: "Demo Scenario: NVIDIA and the AI Boom" },
      note: {
        ja: "最近のAIブームを題材にしたデモ用シナリオです。値動きはデモ用に簡略化した概数で、実際の株価の動きとは異なります。本番のシナリオとも内容が異なります。",
        en: "A demo scenario themed on the recent AI boom. Price moves are simplified approximations for the demo and differ from actual market moves. The full game's scenarios also differ from this one."
      },
      rates: {
        bank:         [ 0.03, -0.04,  0.05],
        auto:         [ 0.12, -0.11,  0.13],
        staples:      [ 0.01, -0.01,  0.02],
        construction: [ 0.02, -0.03,  0.04],
        retail:       [ 0.04, -0.05,  0.06]
      },
      news: [
        {
          headline: { ja: "NVIDIAの決算が市場予想を大幅に上回る、AI需要が爆発", en: "NVIDIA earnings smash expectations as AI demand explodes" },
          reason:   { ja: "AIチップ需要の強さが確認され、半導体や製造業を中心に買われました。", en: "Strong AI chip demand lifted semiconductors and manufacturers." }
        },
        {
          headline: { ja: "米国がAIチップの輸出規制を強化、半導体株に売り", en: "US tightens AI chip export curbs; chip stocks slide" },
          reason:   { ja: "輸出規制で半導体の先行きに不安が広がり、関連株が売られました。", en: "Export curbs clouded the outlook for chipmakers, and related shares fell." }
        },
        {
          headline: { ja: "NVIDIAが次世代AIチップを発表、大手テックも設備投資を拡大", en: "NVIDIA unveils next-gen AI chips as Big Tech ramps up spending" },
          reason:   { ja: "次世代チップと大手テックの投資拡大で、AI相場が再び勢いづきました。", en: "Next-gen chips and bigger Big Tech spending reignited the AI rally." }
        }
      ]
    },
    {
      id: "ceo",
      short: { ja: "某大手半導体設計企業N社 CEOスキャンダル", en: "Company N CEO Scandal" },
      title: { ja: "デモシナリオ：某大手半導体設計企業N社 CEOスキャンダル", en: "Demo Scenario: CEO Scandal at Company N" },
      note: {
        ja: "某大手半導体設計企業N社を舞台にした、デモ用の架空シナリオです（値動きは簡略化した概数です）。実在の企業・人物とは関係ありません。",
        en: "A fictional demo scenario set at Company N, a major semiconductor design firm (price moves are simplified approximations)."
      },
      rates: {
        bank:         [-0.03,  0.01,  0.03],
        auto:         [-0.14, -0.05,  0.10],
        staples:      [-0.01,  0.00,  0.01],
        construction: [-0.02,  0.01,  0.02],
        retail:       [-0.04,  0.00,  0.04]
      },
      news: [
        {
          headline: { ja: "某大手半導体設計企業N社のCEOにスキャンダルが発覚、株価が急落", en: "Scandal erupts around Company N's CEO; shares plunge" },
          reason:   { ja: "某大手半導体設計企業N社の不祥事への嫌気で、半導体・製造業セクターが大きく売られ、市場全体にも不安が広がりました。", en: "Disgust at the scandal at Company N hammered the semiconductor and manufacturing sector, and unease spread across the market." }
        },
        {
          headline: { ja: "某大手半導体設計企業N社のCEOが辞任を表明、後任人事に注目が集まる", en: "Company N's CEO resigns; focus shifts to the successor" },
          reason:   { ja: "辞任でも先行きはなお不透明ですが、売りは一巡し、他の業種は落ち着きを取り戻しました。", en: "The outlook stayed murky, but selling ran its course and other sectors steadied." }
        },
        {
          headline: { ja: "某大手半導体設計企業N社の新CEOが就任し、AI戦略の継続を表明、株価は反発", en: "Company N's new CEO pledges to stay the AI course; shares rebound" },
          reason:   { ja: "新体制への安心感とAI戦略の継続が評価され、当該セクターに買い戻しが入りました。", en: "Relief at the new leadership and the unchanged AI strategy brought buyers back to the sector." }
        }
      ]
    }
  ];

  function rateAt(scenIdx, sectorIdx, round) {
    return SCENARIOS[scenIdx].rates[SECTORS[sectorIdx].id][round];
  }
  function priceAfter(scenIdx, sectorIdx, roundsDone) {
    var p = BASE_PRICE;
    for (var i = 0; i < roundsDone; i++) p *= (1 + rateAt(scenIdx, sectorIdx, i));
    return p;
  }
  /* Split: stock side = floor(total/2) yen worth; cash keeps the rest. */
  function initialSplit(total) {
    var stockMoney = Math.floor(total / 2);
    return { cash: total - stockMoney, stockMoney: stockMoney, shares: stockMoney / BASE_PRICE };
  }
  function maxBuyAmount(cash) {
    return Math.min(MAX_TRADE, Math.floor(cash / UNIT) * UNIT);
  }
  function maxSellAmount(shares, price) {
    return Math.min(MAX_TRADE, Math.floor((shares * price) / UNIT) * UNIT);
  }
  function applyTrade(state, action) {
    var cash = state.cash, shares = state.shares;
    if (action.type === "buy")       { cash -= action.amount; shares += action.amount / state.price; }
    else if (action.type === "sell") { cash += action.amount; shares -= action.amount / state.price; }
    return { cash: cash, shares: shares, price: state.price };
  }
  function simulate(scenIdx, sectorIdx, actions) {
    var s0 = initialSplit(START_TOTAL);
    var st = { cash: s0.cash, shares: s0.shares, price: BASE_PRICE };
    for (var r = 0; r < 3; r++) {
      st = applyTrade(st, actions[r]);
      st = { cash: st.cash, shares: st.shares, price: st.price * (1 + rateAt(scenIdx, sectorIdx, r)) };
    }
    return st.cash + st.shares * st.price;
  }
  function buyAndHold(scenIdx, sectorIdx) {
    return simulate(scenIdx, sectorIdx, [
      { type: "pass", amount: 0 }, { type: "pass", amount: 0 }, { type: "pass", amount: 0 }
    ]);
  }
  function searchBestWorst(scenIdx, sectorIdx) {
    var best = { total: -Infinity, actions: null };
    var worst = { total: Infinity, actions: null };
    function rec(round, cash, shares, price, acts) {
      if (round === 3) {
        var t = cash + shares * price;
        if (t > best.total)  best  = { total: t, actions: acts.slice() };
        if (t < worst.total) worst = { total: t, actions: acts.slice() };
        return;
      }
      var opts = [{ type: "pass", amount: 0 }];
      var a, mb = maxBuyAmount(cash);
      for (a = UNIT; a <= mb; a += UNIT) opts.push({ type: "buy", amount: a });
      var ms = maxSellAmount(shares, price);
      for (a = UNIT; a <= ms; a += UNIT) opts.push({ type: "sell", amount: a });
      for (var i = 0; i < opts.length; i++) {
        var ns = applyTrade({ cash: cash, shares: shares, price: price }, opts[i]);

    }

    rec(0, s0.cash, s0.shares, BASE_PRICE, []);
    return { best: best, worst: worst };

  };

    var pad = (max - min) * 0.15; min -= pad; max += pad;
    function X(i) { return pts.length === 1 ? W / 2 : PL + (W - PL - PR) * (i / (pts.length - 1)); }
    function Y(v) { return PT + (H - PT - PB) * (1 - (v - min) / (max - min)); }

    var maxBuy = C.maxBuyAmount(slot.cash);
    var maxSell = C.maxSellAmount(slot.shares, slot.price);
    if (draft.action === "buy" && draft.amount > Math.max(maxBuy, 0)) draft.amount = maxBuy >= C.UNIT ? maxBuy : C.UNIT;
    if (draft.action === "sell" && draft.amount > Math.max(maxSell, 0)) draft.amount = maxSell >= C.UNIT ? maxSell : C.UNIT;
    var cantBuy = maxBuy < C.UNIT, cantSell = maxSell < C.UNIT;
    var h = "";
    h += '<section class="card gold"><div class="round-label">' + esc(scenShort(state.current)) + "｜" + L("roundOf", r + 1) + "</div>";
    h += '<h2 class="news-head">' + esc(news.headline[state.lang]) + "</h2>";
    h += '<div class="chart-title">' + L("chartTitle", sectorName(slot.sectorIdx)) + "</div>";
    h += '<div class="chart-wrap">' + chartSVG() + "</div>";
    h += '<p style="margin:.6rem 0 0;"><span class="muted small">' + L("priceNow") + '：</span> <span class="price-now num">' + fmtPrice(slot.price) + "</span>" +
         '　<span class="muted small">' + L("sharesHeld") + '：</span> <span class="num">' + (Math.round(slot.shares * 100) / 100).toLocaleString("en-US") + "</span></p>";
    h += "</section>";

    h += '<section class="card"><div class="seg" role="group">';
    ["buy", "sell", "pass"].forEach(function (a) {
      h += '<button type="button" data-action="' + a + '" aria-pressed="' + (draft.action === a) + '">' + L(a) + "</button>";
    });
    h += "</div>";
    if (draft.action !== "pass") {
      var maxFor = draft.action === "buy" ? maxBuy : maxSell;
      h += '<div class="small muted" style="margin-top:.5rem;">' + L("amount") + "</div>";
      h += '<div class="amount-grid">';
      for (var a = C.UNIT; a <= C.MAX_TRADE; a += C.UNIT) {
        h += '<button type="button" data-amount="' + a + '" aria-pressed="' + (draft.amount === a) + '" ' + (a > maxFor ? "disabled" : "") + ">" + fmtAmountBtn(a) + "</button>";
      }
      h += '<button type="button" data-amount="max" aria-pressed="false" ' + (maxFor < C.UNIT ? "disabled" : "") + ">" + (draft.action === "buy" ? L("buy") : L("sell")) + " " + L("maxWord") + (maxFor >= C.UNIT ? "（" + fmtAmountBtn(maxFor) + "）" : "") + "</button>";
      h += "</div>";
      h += '<p class="muted small" style="margin:.1rem 0;">' + L("maxNote") + "</p>";
      if (draft.action === "buy" && cantBuy) h += '<p class="warn">' + L("cantBuy") + "</p>";
      if (draft.action === "sell" && cantSell) h += '<p class="warn">' + L("cantSell") + "</p>";
    }
    h += '<div class="small muted" style="margin-top:.7rem;">' + L("rationale") + "</div>";
    h += '<div class="radio-list">';
    RATIONALES.forEach(function (o) {
      h += '<label class="radio-chip"><input type="radio" name="rationale" value="' + o.id + '"' + (draft.rationale === o.id ? " checked" : "") + " />" + esc(state.lang === "en" ? o.en : o.ja) + "</label>";
    });
    h += "</div>";
    h += '<details class="adv"><summary>' + L("advTitle") + "</summary>";
    h += '<label class="small muted">' + L("advLabel") + ' <input type="number" id="drawdown" min="0" max="100" step="1" inputmode="numeric" placeholder="' + L("advPh") + '" value="' + esc(draft.drawdown) + '" /></label>';
    h += "</details>";
    var confirmDisabled = (draft.action === "buy" && cantBuy) || (draft.action === "sell" && cantSell);
    h += '<button type="button" class="btn primary" id="btn-confirm" ' + (confirmDisabled ? "disabled" : "") + ">" + L("confirmTrade") + "</button>";
    h += '<div class="btn-row" style="margin-top:.7rem;"><button type="button" class="btn ghost" id="btn-home">' + L("homeBtn") + '</button><button type="button" class="btn danger" id="btn-reset">' + L("reset") + "</button></div>";
    h += "</section>";
    app.innerHTML = h;

    Array.prototype.forEach.call(document.querySelectorAll("[data-action]"), function (el) {
      el.addEventListener("click", function () {
        var a = el.getAttribute("data-action");
        draft.action = a; draft.rationale = DEFAULT_RATIONALE[a]; draft.amount = C.UNIT;
        renderPlay(); renderBar();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-amount]"), function (el) {
      el.addEventListener("click", function () {
        var v = el.getAttribute("data-amount");
        draft.amount = v === "max" ? (draft.action === "buy" ? maxBuy : maxSell) : Number(v);
        renderPlay(); renderBar();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="rationale"]'), function (el) {
      el.addEventListener("change", function () { draft.rationale = el.value; });
    });
    var dd = document.getElementById("drawdown");
    if (dd) dd.addEventListener("input", function () { draft.drawdown = dd.value; });
    document.getElementById("btn-confirm").addEventListener("click", executeTrade);
    document.getElementById("btn-home").addEventListener("click", function () { state.view = "home"; save(); render(); });
    document.getElementById("btn-reset").addEventListener("click", function () { openReset(state.current); });
  }

  function executeTrade() {
    var slot = cur();
    var r = slot.round;
    var priceBefore = slot.price;
    var action = { type: draft.action, amount: draft.action === "pass" ? 0 : draft.amount };
    var ns = C.applyTrade({ cash: slot.cash, shares: slot.shares, price: priceBefore }, action);
    var rate = C.rateAt(state.current, slot.sectorIdx, r);
    var priceAfter = priceBefore * (1 + rate);
    var entry = {
      round: r, type: action.type, amount: action.amount,
      rationale: draft.rationale, drawdown: draft.drawdown === "" ? null : Number(draft.drawdown),
      priceBefore: priceBefore, priceAfter: priceAfter, rate: rate,
      sharesBefore: slot.shares, sharesAfter: ns.shares,
      cashAfter: ns.cash, valueAfter: ns.shares * priceAfter
    };
    slot.cash = ns.cash; slot.shares = ns.shares; slot.price = priceAfter;
    slot.log.push(entry); slot.lastExec = entry; slot.step = "executed";
    save(); render();
  }

  function renderExecuted() {
    var slot = cur();
    var e = slot.lastExec;
    var news = C.SCENARIOS[state.current].news[e.round];
    var h = '<section class="card gold"><div class="round-label">' + esc(scenShort(state.current)) + "｜" + L("roundOf", e.round + 1) + "</div>";
    h += '<h2 class="news-head">' + esc(news.headline[state.lang]) + "</h2>";
    h += '<div class="chart-title">' + L("chartTitle", sectorName(slot.sectorIdx)) + "</div>";
    h += '<div class="chart-wrap">' + chartSVG() + "</div></section>";
    h += '<div class="exec-box"><h3 style="margin-bottom:.5rem;">' + L("execTitle") + "</h3>";
    h += '<div class="kv"><span>' + L("execAction") + "</span><b>" + actionName(e.type) + (e.type !== "pass" ? " " + fmtYen(e.amount) : "") + "</b></div>";
    h += '<div class="kv"><span>' + L("execPrice") + "</span><b class=\"num\">" + fmtPrice(e.priceBefore) + "</b></div>";
    h += '<div class="kv"><span>' + L("execShares") + "</span><b class=\"num\">" + (Math.round(e.sharesAfter * 100) / 100).toLocaleString("en-US") + "</b></div>";
    h += '<div class="kv"><span>' + L("execCash") + "</span><b class=\"num\">" + fmtYen(e.cashAfter) + "</b></div>";
    h += '<div class="kv"><span>' + L("priceMove") + "</span><b class=\"num " + (e.rate > 0 ? "pnl-pos" : e.rate < 0 ? "pnl-neg" : "") + '">' + fmtPrice(e.priceBefore) + " → " + fmtPrice(e.priceAfter) + "（" + fmtPct(e.rate) + "）</b></div>";
    h += '<div class="kv"><span>' + L("moveReason") + "</span><b style=\"max-width:62%;\">" + esc(news.reason[state.lang]) + "</b></div>";
    h += "</div>";
    var isLast = e.round === 2;
    h += '<button type="button" class="btn primary" id="btn-next">' + (isLast ? L("toResult") : L("nextRound")) + "</button>";
    app.innerHTML = h;
    document.getElementById("btn-next").addEventListener("click", function () {
      if (isLast) { finishGame(); }
      else { slot.round += 1; slot.step = "decide"; resetDraft("buy"); save(); render(); }
    });
  }

  function finishGame() {
    var slot = cur();
    var total = slotTotal(slot);
    var bw = C.searchBestWorst(state.current, slot.sectorIdx);
    slot.result = {
      total: total, pnl: total - C.START_TOTAL,
      hold: C.buyAndHold(state.current, slot.sectorIdx),
      best: bw.best.total, worst: bw.worst.total
    };
    slot.cash = total; slot.shares = 0;
    slot.status = "done"; slot.step = "decide";
    state.view = "done";
    save(); render();
  }

  function logLine(e) {
    var s = "R" + (e.round + 1) + "：" + actionName(e.type);
    if (e.type !== "pass") s += " " + fmtYen(e.amount);
    s += "｜" + L("rationale") + "：" + rationaleName(e.rationale);
    if (e.drawdown !== null && e.drawdown !== undefined) s += "｜" + L("drawdown") + "：" + e.drawdown + "%";
    return s;
  }
  function historyLine(e) {
    var s = "R" + (e.round + 1) + "：" + actionName(e.type);
    if (e.type !== "pass") s += " " + fmtYen(e.amount) + " @" + fmtPrice(e.priceBefore);
    s += " → " + fmtPct(e.rate) + "｜" + L("moveReason") + "：" + C.SCENARIOS[state.current].news[e.round].reason[state.lang];
    return s;
  }

  function renderDone() {
    var slot = cur();
    var res = slot.result;
    var diff = res.total - res.hold;
    var maxBar = Math.max(res.total, res.hold, res.best, res.worst);
    function bar(label, val, cls) {
      var w = maxBar > 0 ? Math.max(2, (val / maxBar) * 100) : 0;
      return '<div class="bar-row"><span>' + label + '</span><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + w.toFixed(1) + '%"></div></div><span class="bar-val num">' + fmtYen(val) + "</span></div>";
    }
    var h = '<section class="card gold result-hero"><div class="round-label">' + esc(scenTitle(state.current)) + "｜" + L("resultTitle") + "</div>";
    h += '<div class="result-pnl num ' + (res.pnl > 0 ? "pnl-pos" : res.pnl < 0 ? "pnl-neg" : "") + '" style="margin-top:.4rem;">' + L("pnl") + " " + fmtSignedYen(res.pnl) + "（" + fmtSignedUsd(res.pnl) + "） ／ " + (res.pnl >= 0 ? "+" : "−") + Math.abs(Math.round((res.pnl / C.START_TOTAL) * 1000) / 10) + "%</div>";
    h += '<div class="result-total num">' + L("finalTotal") + "：" + fmtYen(res.total) + ' <span class="muted" style="font-size:.9rem;">' + fmtUsd(res.total) + "</span></div>";
    h += '<p class="muted small">' + sectorName(slot.sectorIdx) + "｜" + L("autoSold") + "</p>";
    h += '<h3 style="text-align:left;margin-top:1rem;">' + L("compare") + "</h3>";
    h += '<div class="bars">';
    h += bar(L("you"), res.total, "you");
    h += bar(L("hold"), res.hold, "");
    h += bar(L("best"), res.best, "best");
    h += bar(L("worst"), res.worst, "worst");
    h += "</div>";
    var cmp = Math.round(diff) === 0 ? L("matched") : diff > 0 ? L("beatHold", fmtYen(diff)) : L("lostHold", fmtYen(-diff));
    h += '<p style="font-weight:700;">' + cmp + "</p>";
    h += "</section>";

    h += '<section class="card"><h3 style="margin-bottom:.4rem;">' + L("decisionLog") + '</h3><ul class="log-list">';
    slot.log.forEach(function (e) { h += "<li>" + esc(logLine(e)) + "</li>"; });
    h += '</ul><h3 style="margin:1rem 0 .4rem;">' + L("history") + '</h3><ul class="log-list">';
    slot.log.forEach(function (e) { h += "<li>" + esc(historyLine(e)) + "</li>"; });
    h += "</ul></section>";

    h += '<div class="promo"><div class="p-title">' + L("promoTitle") + '</div><p style="margin:0;">' + esc(L("promoBody")) + "</p></div>";
    h += '<button type="button" class="btn primary" id="btn-again">' + L("again") + "</button>";
    h += '<div class="btn-row" style="margin-top:.6rem;"><button type="button" class="btn ghost" id="btn-home">' + L("homeBtn") + '</button><button type="button" class="btn danger" id="btn-reset">' + L("reset") + "</button></div>";
    app.innerHTML = h;
    document.getElementById("btn-again").addEventListener("click", function () {
      state.slots[state.current] = freshSlot();
      sectorPick = 0; state.view = "sector";
      save(); render();
    });
    document.getElementById("btn-home").addEventListener("click", function () { state.view = "home"; save(); render(); });
    document.getElementById("btn-reset").addEventListener("click", function () { openReset(state.current); });
  }

  /* ---------- reset modal ---------- */
  var modal = document.getElementById("reset-modal");
  function openReset(scenIdx) {
    pendingReset = scenIdx;
    document.getElementById("reset-title").textContent = L("resetTitle");
    document.getElementById("reset-body").textContent = L("resetBody");
    document.getElementById("reset-yes").textContent = L("resetYes");
    document.getElementById("reset-no").textContent = L("cancel");
    modal.hidden = false;
  }
  function closeReset() { modal.hidden = true; }
  document.getElementById("reset-no").addEventListener("click", closeReset);
  modal.addEventListener("click", function (ev) { if (ev.target === modal) closeReset(); });
  document.getElementById("reset-yes").addEventListener("click", function () {
    state.slots[pendingReset] = freshSlot();
    if (state.current === pendingReset && state.view !== "home") state.view = "home";
    closeReset(); save(); render();
  });

  /* ---------- language ---------- */
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "ja" ? "en" : "ja";
    save(); render();
  });

  function render() {
    renderBar();
    if (state.view === "sector") renderSector();
    else if (state.view === "play") renderPlay();
    else if (state.view === "done") renderDone();
    else renderHome();
  }

  load();
  if (state.view === "play" && cur().step === "decide") resetDraft("buy");
  render();
})();

    </script>
  </body>
</html>
