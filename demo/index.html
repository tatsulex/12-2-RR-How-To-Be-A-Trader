<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>投資1年目の教科書 デモ版</title>
    <style>
      :root{
        --bg:#f4f5f3; --card:#ffffff; --card2:#eef0ec; --ink:#171a17; --muted:#5c665c; --line:#dde1da;
        --accent:#0f6b4a; --accent2:#b7791f; --up:#1a7f37; --down:#c62828; --dark:#0d1110;
        --radius:14px;
        --g1:#14916a; --g2:#0b5c3e; --gedge:#063d28;
        --r1:#e84542; --r2:#b71c1c; --redge:#6d0f0f;
        --gold1:#ffe082; --gold2:#f2b705; --goldedge:#9a7200;
        --neu1:#ffffff; --neu2:#e3e7e1; --neuedge:#b9c0b6;
        --lux-gold:#c9a227; --lux-gold-hi:#f6e27a; --lux-gold-lt:#fff3c4; --lux-gold-dk:#8a6d1b;
        --lux-obsidian:#0a0f0d; --lux-obsidian2:#16211b;
        --lux-card-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(138,109,27,.12) inset,0 2px 6px rgba(20,26,20,.07),0 14px 34px rgba(20,26,20,.10),0 28px 56px rgba(20,26,20,.06);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#101312; --card:#1a1e1b; --card2:#222723; --ink:#edf0eb; --muted:#a7b0a6; --line:#2e352f;
          --accent:#3cb179; --accent2:#e0aa3e; --up:#4cc27a; --down:#f2706a;
          --g1:#37a06d; --g2:#17714c; --gedge:#0b4a30;
          --r1:#e0524e; --r2:#a92323; --redge:#5f1010;
          --gold1:#ffd968; --gold2:#d99a06; --goldedge:#7a5600;
          --neu1:#333b34; --neu2:#232824; --neuedge:#121613;
          --lux-card-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 -1px 0 rgba(0,0,0,.5) inset,0 2px 6px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.45),0 28px 56px rgba(0,0,0,.35);
        }
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0;
        background:
          radial-gradient(1100px 480px at 85% -120px, rgba(201,162,39,.10), transparent 62%),
          radial-gradient(900px 420px at -10% 8%, rgba(15,107,74,.07), transparent 60%),
          linear-gradient(180deg, #fbfaf6 0%, var(--bg) 340px);
        color:var(--ink);
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
        line-height:1.6;
        min-height:100vh;
      }
      @media (prefers-color-scheme: dark){
        body{ background:radial-gradient(1100px 480px at 85% -120px, rgba(201,162,39,.12), transparent 62%), radial-gradient(900px 420px at -10% 8%, rgba(60,177,121,.08), transparent 60%), linear-gradient(180deg, #141816 0%, var(--bg) 340px); }
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]){ min-height:44px; }
      button{ font-family:inherit; cursor:pointer; }
      .num{
        font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
        font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;
      }

      /* ---------- asset bar (same as the full game) ---------- */
      .assetBar{
        position:sticky; top:0; z-index:90; color:#fff; padding:8px 16px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.02) 48%, rgba(0,0,0,.18) 100%),
          linear-gradient(120deg, #1a261f, var(--lux-obsidian) 70%);
        border-bottom:1px solid var(--lux-gold);
        box-shadow:0 1px 0 rgba(255,255,255,.16) inset, 0 12px 30px rgba(10,15,13,.34);
      }
      .assetBarInner{ max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; }
      .assetBar .abLab{ display:block; font-size:11px; font-weight:700; letter-spacing:.06em; color:#aeb8ae; line-height:1.3; }
      .assetBar .abMain{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-right:4px; }
      .assetBar .abMain .abLab{ width:100%; }
      .abTotal{
        font-size:26px; font-weight:900; line-height:1.1; white-space:nowrap; color:var(--lux-gold-hi);
        text-shadow:0 0 18px rgba(246,226,122,.28), 0 1px 2px rgba(0,0,0,.5);
        font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
        font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;
      }
      .abUsd{ font-size:13px; color:var(--lux-gold-hi); white-space:nowrap; font-variant-numeric:tabular-nums; }
      .abItem .abVal{
        font-size:17px; font-weight:800; line-height:1.2; white-space:nowrap;
        font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
        font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;
      }
      .abCtx{ font-size:12px; color:#c8d0c8; font-weight:700; }
      @media (max-width:560px){ .assetBar{ padding:8px 12px; } .abTotal{ font-size:22px; } .abItem .abVal{ font-size:15px; } .assetBarInner{ gap:6px 14px; } }
      .langBtn{
        margin-left:auto; appearance:none; border:1px solid rgba(246,226,122,.55);
        background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
        color:#ffe9a8; font-weight:800; font-size:13px; border-radius:999px; padding:7px 14px;
        min-height:36px; cursor:pointer; white-space:nowrap;
        box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 4px 10px rgba(0,0,0,.3);
      }
      .langBtn:active{ transform:translateY(1px); }
      .pnl-pos{ color:var(--up); } .pnl-neg{ color:var(--down); }

      main{ max-width:1080px; margin:0 auto; padding:16px 16px 56px; }

      /* ---------- generic cards & buttons ---------- */
      .card{
        background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #faf6ea 135%);
        border:1px solid rgba(138,109,27,.28);
        border-radius:var(--radius);
        box-shadow:var(--lux-card-shadow);
        padding:18px;
        margin-bottom:1rem;
      }
      @media (prefers-color-scheme: dark){
        .card{ background:linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #232a22 135%); border-color:rgba(246,226,122,.20); }
      }
      .card.gold{ border-color:var(--lux-gold); }
      h1,h2,h3{ font-family:inherit; margin:0; letter-spacing:.02em; }
      .btn{
        position:relative; overflow:hidden; isolation:isolate;
        display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
        appearance:none; border:1px solid rgba(4,40,26,.55); border-radius:13px;
        background:linear-gradient(180deg, #3ecf8e 0%, #17a06b 38%, var(--accent) 62%, #0a4f34 100%);
        color:#fff; font-weight:700; font-size:16px; padding:12px 18px; min-height:44px;
        text-decoration:none; text-shadow:0 1px 2px rgba(0,0,0,.35);
        box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 -2px 0 rgba(0,0,0,.22) inset, 0 5px 0 var(--gedge), 0 16px 32px rgba(10,60,38,.32), 0 30px 52px rgba(201,162,39,.10);
        transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
      }
      .btn::after{
        content:""; position:absolute; inset:1px 1px 52% 1px; border-radius:11px 11px 60% 60%/11px 11px 18px 18px;
        background:linear-gradient(180deg, rgba(255,255,255,.50), rgba(255,255,255,.06)); pointer-events:none; z-index:0;
      }
      .btn:hover:not(:disabled){ filter:brightness(1.09) saturate(1.05); transform:translateY(-1px); }
      .btn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(0,0,0,.25) inset, 0 1px 0 var(--gedge), 0 6px 14px rgba(10,60,38,.28); }
      .btn.primary{
        background:linear-gradient(180deg, var(--lux-gold-lt) 0%, var(--lux-gold-hi) 34%, var(--gold2) 68%, #c78f04 100%);
        color:#2a1e00; border-color:rgba(90,64,0,.5); text-shadow:0 1px 0 rgba(255,255,255,.65);
        box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 -2px 0 rgba(120,84,0,.30) inset, 0 4px 0 var(--goldedge), 0 16px 32px rgba(0,0,0,.38), 0 24px 48px rgba(201,162,39,.22);
        font-size:1.05rem; width:100%;
      }
      .btn.primary:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 2px 5px rgba(120,84,0,.3) inset, 0 1px 0 var(--goldedge), 0 3px 8px rgba(0,0,0,.35); }
      .btn.ghost{
        background:linear-gradient(180deg, #ffffff 0%, #f4f1e6 45%, var(--neu2) 100%);
        color:var(--ink); text-shadow:none; border-color:rgba(138,109,27,.32);
        box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 -1px 0 rgba(138,109,27,.14) inset, 0 3px 0 var(--neuedge), 0 12px 24px rgba(20,26,20,.13);
      }
      @media (prefers-color-scheme: dark){ .btn.ghost{ background:linear-gradient(180deg, #454e46 0%, #2e352f 48%, var(--neu2) 100%); border-color:rgba(246,226,122,.22); } }
      .btn.ghost::after{ background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.10)); }
      .btn.ghost:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 5px rgba(0,0,0,.14) inset, 0 0 0 var(--neuedge), 0 2px 6px rgba(20,30,22,.14); }
      .btn.danger{
        background:linear-gradient(180deg, #ff7a72 0%, #e84542 38%, var(--down) 62%, #7d1212 100%);
        color:#fff; border-color:rgba(60,8,8,.5);
        box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 -2px 0 rgba(0,0,0,.22) inset, 0 5px 0 var(--redge), 0 16px 32px rgba(120,16,16,.30);
      }
      .btn.danger:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(0,0,0,.25) inset, 0 1px 0 var(--redge), 0 6px 14px rgba(120,16,16,.28); }
      .btn:disabled{ opacity:1; background:linear-gradient(180deg, #d8dcd6, #a9afa9); color:#57605a; border-color:#969e97; text-shadow:none; box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 2px 0 #878f88, 0 8px 16px rgba(20,26,20,.12); cursor:not-allowed; }
      .btn:disabled::after{ display:none; }
      @media (prefers-color-scheme: dark){ .btn:disabled{ background:linear-gradient(180deg, #3a403a, #292e29); color:#8b948b; } }
      .btn-row{ display:flex; gap:.6rem; flex-wrap:wrap; }
      .muted{ color:var(--muted); } .small{ font-size:.83rem; }
      .gold-text{ color:var(--lux-gold-dk); }
      @media (prefers-color-scheme: dark){ .gold-text{ color:var(--lux-gold-hi); } }

      /* ---------- hero (topbar) & holdings ---------- */
      .topbar{
        color:#fff; border-radius:20px; padding:20px 22px 24px; margin-bottom:16px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.03) 42%, rgba(255,255,255,0) 55%),
          linear-gradient(155deg, #1c2a22 0%, var(--lux-obsidian2) 42%, var(--lux-obsidian) 100%);
        border:1px solid rgba(246,226,122,.30); border-bottom:2px solid var(--lux-gold);
        box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 18px 40px rgba(10,15,13,.28), 0 36px 72px rgba(10,15,13,.14);
      }
      .topinfo{ display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-size:14px; color:#d6ddd6; padding:.3rem 0; }
      .topinfo b{ color:#fff; font-variant-numeric:tabular-nums; }
      .topinfo .dim{ color:#aeb8ae; }
      .topbar-rule{ border-bottom:1px solid rgba(246,226,122,.22); margin:.55rem 0 .9rem; }
      .pill{
        display:inline-block; border:1px solid rgba(246,226,122,.35); color:#e8ede8;
        padding:6px 10px; border-radius:999px; font-size:13px; font-weight:700; letter-spacing:.14em;
        background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
        box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 6px 16px rgba(0,0,0,.28);
      }
      .game-title{ font-size:28px; line-height:1.25; font-weight:800; color:#fff; margin:.8rem 0 .4rem; letter-spacing:.03em; text-shadow:0 2px 18px rgba(0,0,0,.45); }
      @media (min-width:700px){ .game-title{ font-size:38px; } }
      .scen-line{ font-size:15px; color:#e8ede8; margin:0 0 .5rem; }
      .lead{ color:#d6ddd6; max-width:660px; font-size:15px; margin:0; }
      .topcta{
        position:relative; overflow:hidden; margin-top:16px;
        display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
        border:1px solid rgba(90,64,0,.5); border-radius:999px; padding:14px 30px;
        background:linear-gradient(180deg, var(--lux-gold-lt) 0%, var(--lux-gold-hi) 34%, var(--gold2) 68%, #c78f04 100%);
        color:#2a1e00; font-weight:800; font-size:17px; text-shadow:0 1px 0 rgba(255,255,255,.65);
        box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 -2px 0 rgba(120,84,0,.30) inset, 0 4px 0 var(--goldedge), 0 16px 32px rgba(0,0,0,.38), 0 24px 48px rgba(201,162,39,.22);
        transition:transform .08s ease, filter .15s ease;
      }
      .topcta:hover{ filter:brightness(1.06); transform:translateY(-1px); }
      .topcta:active{ transform:translateY(3px); }
      .holdings{
        color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:1rem;
        background:
          linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.02) 46%, rgba(0,0,0,.22) 100%),
          linear-gradient(140deg, #1d2f26, var(--lux-obsidian) 75%);
        border:1px solid rgba(246,226,122,.28);
        box-shadow:0 1px 0 rgba(255,255,255,.16) inset, 0 16px 36px rgba(10,15,13,.26);
      }
      .holdings-title{ font-size:12px; color:#aeb8ae; font-weight:700; letter-spacing:.06em; }
      .holdings .grid3h{ display:grid; gap:10px; margin-top:8px; }
      @media (min-width:640px){ .holdings .grid3h{ grid-template-columns:repeat(3,1fr); } }
      .holdings small{ color:#aeb8ae; display:block; font-size:13px; }
      .holdings .v{
        font-size:22px; font-weight:800; line-height:1.2;
        font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
        font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;
      }
      .holdings .total .v{ font-size:30px; color:var(--lux-gold-hi); text-shadow:0 0 18px rgba(246,226,122,.28), 0 1px 2px rgba(0,0,0,.5); }
      .usdsub{ font-size:12px; color:#aeb8ae; font-variant-numeric:tabular-nums; margin-top:1px; }
      .holdings .total .usdsub{ color:var(--lux-gold-hi); }
      .holdings-foot{ border-top:1px solid rgba(246,226,122,.22); margin-top:12px; padding-top:10px; font-size:14px; display:flex; gap:.6rem 2.2rem; flex-wrap:wrap; }
      .howto{ display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; margin:0 0 1rem; }
      .howto .step{
        background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #faf6ea 135%);
        border:1px solid rgba(138,109,27,.28); border-radius:var(--radius); box-shadow:var(--lux-card-shadow); padding:.85rem .9rem;
      }
      @media (prefers-color-scheme: dark){ .howto .step{ background:linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #232a22 135%); border-color:rgba(246,226,122,.20); } }
      .howto .n{ color:var(--lux-gold-dk); font-size:1.3rem; font-weight:900; }
      @media (prefers-color-scheme: dark){ .howto .n{ color:var(--lux-gold-hi); } }
      .howto p{ margin:.25rem 0 0; font-size:.86rem; color:var(--muted); }
      @media (max-width:640px){ .howto{ grid-template-columns:1fr; } }
      .scenario-head{ color:var(--lux-gold-dk); font-size:12px; font-weight:700; letter-spacing:.08em; }
      @media (prefers-color-scheme: dark){ .scenario-head{ color:var(--lux-gold-hi); } }
      .scenario-title{ font-size:20px; font-weight:800; margin:.25rem 0 .4rem; line-height:1.4; }
      .tag{ display:inline-block; font-size:12px; padding:3px 8px; border-radius:999px; background:var(--card2); color:var(--muted); margin-right:6px; box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 3px 8px rgba(20,26,20,.10); }

      /* ---------- sectors ---------- */
      .sector-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.7rem; }
      .sector-opt{
        text-align:left; width:100%; border:1px solid rgba(138,109,27,.28); border-radius:var(--radius);
        background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #faf6ea 135%);
        box-shadow:var(--lux-card-shadow);
        color:var(--ink); padding:.95rem 1rem; font-size:1rem; font-weight:700;
      }
      @media (prefers-color-scheme: dark){ .sector-opt{ background:linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 34%), linear-gradient(165deg, var(--card) 0%, var(--card) 58%, #232a22 135%); border-color:rgba(246,226,122,.20); } }
      .sector-opt[aria-checked="true"]{
        background:linear-gradient(180deg, rgba(255,243,196,.5), rgba(255,255,255,0) 44%), linear-gradient(165deg, var(--card2), var(--card) 130%);
        border-color:var(--lux-gold); outline:2px solid var(--lux-gold); color:var(--ink);
        box-shadow:inset 0 2px 10px rgba(138,109,27,.16), 0 1px 0 rgba(255,255,255,.7) inset, var(--lux-card-shadow);
      }
      .sector-opt .en{ display:block; font-size:.75rem; color:var(--muted); font-weight:500; margin-top:.15rem; }

      /* ---------- play ---------- */
      .round-label{ color:var(--lux-gold-dk); font-weight:700; font-size:12px; letter-spacing:.08em; }
      @media (prefers-color-scheme: dark){ .round-label{ color:var(--lux-gold-hi); } }
      .news-head{ font-size:clamp(1.25rem,4.5vw,1.6rem); font-weight:800; line-height:1.45; margin:.3rem 0 .2rem; }
      .chart-title{ font-size:.9rem; color:var(--muted); margin-bottom:.3rem; }
      .chart-wrap{
        border-radius:10px; padding:.6rem .4rem .2rem; color:#e8ede8;
        background:linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.01) 40%, rgba(0,0,0,.25) 100%), linear-gradient(150deg, #131a20, #0b0e13 70%);
        border:1px solid rgba(246,226,122,.22);
        box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 16px 36px rgba(8,10,14,.30);
      }
      .price-now{ font-size:1.05rem; font-weight:700; }
      .seg{
        display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:8px; border-radius:16px; margin:.4rem 0 .2rem;
        background:linear-gradient(180deg, #d9ddd2, #eef0e9); border:1px solid rgba(138,109,27,.28);
        box-shadow:inset 0 2px 8px rgba(20,26,20,.20), 0 1px 0 rgba(255,255,255,.8) inset;
      }
      @media (prefers-color-scheme: dark){ .seg{ background:linear-gradient(180deg, #171b18, #232824); } }
      .seg button{
        border-radius:999px; border:1px solid rgba(138,109,27,.26); color:var(--ink);
        background:linear-gradient(180deg, #ffffff 0%, #f5f2e8 46%, var(--neu2) 100%);
        box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 -1px 0 rgba(138,109,27,.12) inset, 0 3px 0 var(--neuedge), 0 10px 20px rgba(20,26,20,.12);
        font-size:1.05rem; font-weight:800; padding:.7rem .3rem;
        transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
      }
      @media (prefers-color-scheme: dark){ .seg button{ background:linear-gradient(180deg, #454e46 0%, #2e352f 48%, var(--neu2) 100%); border-color:rgba(246,226,122,.18); } }
      .seg button:active{ transform:translateY(2px); }
      .seg button[data-action="buy"][aria-pressed="true"]{
        background:linear-gradient(180deg, #46d68f 0%, #22b06e 40%, var(--up) 68%, #0d5c2e 100%); color:#fff; transform:translateY(2px);
        box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 2px 8px rgba(0,0,0,.25) inset, 0 1px 0 var(--gedge), 0 8px 18px rgba(16,90,44,.30);
      }
      .seg button[data-action="sell"][aria-pressed="true"]{
        background:linear-gradient(180deg, #ff7a72 0%, #e84542 40%, var(--down) 68%, #7d1212 100%); color:#fff; transform:translateY(2px);
        box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 2px 8px rgba(0,0,0,.25) inset, 0 1px 0 var(--redge), 0 8px 18px rgba(120,16,16,.30);
      }
      .seg button[data-action="pass"][aria-pressed="true"]{
        background:linear-gradient(180deg, var(--lux-gold-lt) 0%, var(--lux-gold-hi) 40%, var(--gold2) 68%, #c78f04 100%); color:#2a1e00; transform:translateY(2px);
        box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 2px 8px rgba(120,84,0,.25) inset, 0 1px 0 var(--goldedge), 0 8px 18px rgba(138,109,27,.30);
      }

  function freshSlot() {
    return {
      status: "idle", /* idle | playing | done */
      sectorIdx: null, round: 0, step: "decide", /* decide | executed */
      cash: C.START_TOTAL, shares: 0, price: C.BASE_PRICE,
      log: [], lastExec: null, result: null, avgCost: null
    };
  }
  function freshState() {
    return { v: 3, lang: "ja", view: "home", current: 0, slots: [freshSlot()] };
  }
  var state = freshState();
  var draft = { action: "buy", amount: C.UNIT, rationale: "bullish", drawdown: "" };
  var sectorPick = 0;
  var pendingReset = 0;

  function cur() { return state.slots[state.current]; }

  function save() {
    try { localStorage.setItem(C.SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(C.SAVE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && typeof s === "object" && s.v === 3 && Array.isArray(s.slots) && s.slots.length === C.SCENARIOS.length) {
        var f = freshState();
        state = Object.assign(f, s);
        state.slots = s.slots.map(function (sl) { return Object.assign(freshSlot(), sl || {}); });
      }
    } catch (e) {}
  }

  function L(key) {
    var e = STR[key];
    if (!e) return key;
    var s = e[state.lang] || e.ja;
    for (var i = 1; i < arguments.length; i++) s = s.replace("%" + i, arguments[i]);
    return s;
  }
  function sectorName(i) { return L("stockName"); }
  function scenTitle(i) { return C.SCENARIOS[i].title[state.lang]; }
  function scenShort(i) { return C.SCENARIOS[i].short[state.lang]; }
  function rationaleName(id) {
    for (var i = 0; i < RATIONALES.length; i++) if (RATIONALES[i].id === id) return state.lang === "en" ? RATIONALES[i].en : RATIONALES[i].ja;
    return id;
  }
  function fmtYen(n) {
    var r = Math.round(n);
    return (r < 0 ? "−¥" : "¥") + Math.abs(r).toLocaleString("en-US");
  }
  function fmtSignedYen(n) {
    var r = Math.round(n);
    if (r === 0) return "¥0";
    return (r > 0 ? "+¥" : "−¥") + Math.abs(r).toLocaleString("en-US");
  }
  function fmtUsd(jpy) {
    var v = C.usd(jpy);
    var a = Math.abs(v).toFixed(2);
    var parts = a.split(".");
    parts[0] = Number(parts[0]).toLocaleString("en-US");
    return (v < 0 ? "-$" : "$") + parts.join(".");
  }
  function fmtSignedUsd(jpy) {
    var v = C.usd(jpy);
    if (v === 0) return "$0.00";
    return (v > 0 ? "+" : "") + fmtUsd(jpy);
  }
  function fmtAmountBtn(a) {
    return state.lang === "en" ? "¥" + (a / 1000) + "k" : fmtYen(a);
  }
  function fmtPrice(p) {
    return "¥" + p.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function fmtPct(rate) {
    var v = Math.round(rate * 1000) / 10;
    return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v) + "%";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function slotTotal(slot) { return slot.cash + slot.shares * slot.price; }
  function actionName(type) { return L(type); }

    else st.textContent = scenShort(state.current);

    document.documentElement.lang = state.lang;

  /* ---------- chart (candlestick terminal, same as the full game) ---------- */
  function chartSVG() {
    var slot = cur();
    var candles = C.NVDA_CANDLES;
    var total = candles.length;
    var endIdx = C.candleVisibleEnd(slot.round, slot.step);
    var curC = candles[endIdx];
    var W = 900, H = 436, PL = 6, AXIS = 78, PW = W - PL - AXIS;
    var PT = 14, PH = 264, VT = PT + PH + 30, VH = 56;
    var min = Infinity, max = -Infinity, vmax = 0, i, cd;
    for (i = 0; i <= endIdx; i++) {
      cd = candles[i];
      if (cd.jl < min) min = cd.jl;
      if (cd.jh > max) max = cd.jh;
      if (cd.vol > vmax) vmax = cd.vol;
    }
    var padV = (max - min) * 0.09; min -= padV; max += padV;
    var slotW = PW / total, bodyW = Math.max(3, slotW * 0.62);
    function X(i2) { return PL + PW * ((i2 + 0.5) / total); }
    function Y(v) { return PT + PH * (1 - (v - min) / (max - min)); }
    function YV(v) { return VT + VH * (1 - v / vmax); }
    function num(v) { return Math.round(v).toLocaleString("en-US"); }
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + esc(L("candleTitle")) + '">';
    /* future (undisclosed) area */
    var bx = PL + PW * ((endIdx + 1) / total);
    if (endIdx < total - 1) {
      out += '<rect x="' + bx.toFixed(1) + '" y="' + PT + '" width="' + (PL + PW - bx).toFixed(1) + '" height="' + (PH + VH + 30 - PT) + '" fill="rgba(255,255,255,.025)"/>';
      out += '<text x="' + ((bx + PL + PW) / 2).toFixed(1) + '" y="' + (PT + 34) + '" fill="#8fa0b8" font-size="17" font-weight="700" text-anchor="middle">' + esc(L("undisclosed")) + "</text>";
    }
    /* price grid + right axis */
    for (var g = 0; g <= 4; g++) {
      var gv = min + (max - min) * g / 4, gy = Y(gv);
      out += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (PL + PW) + '" y2="' + gy.toFixed(1) + '" stroke="rgba(255,255,255,.07)"/>';
      out += '<text x="' + (PL + PW + 8) + '" y="' + (gy + 4).toFixed(1) + '" fill="#aeb9c9" font-size="13">' + num(gv) + "</text>";
    }
    /* volume grid line */
    out += '<line x1="' + PL + '" y1="' + VT + '" x2="' + (PL + PW) + '" y2="' + VT + '" stroke="rgba(255,255,255,.07)"/>';
    out += '<text x="' + (PL + PW + 8) + '" y="' + (VT + 14) + '" fill="#aeb9c9" font-size="13">' + Math.round(vmax / 10000).toLocaleString("en-US") + "</text>";
    out += '<text x="' + (W - 2) + '" y="' + (VT - 8) + '" fill="#aeb9c9" font-size="12" text-anchor="end">' + esc(L("volUnit")) + "</text>";
    /* candles + volume bars */
    for (i = 0; i <= endIdx; i++) {
      cd = candles[i];
      var up = cd.jc >= cd.jo;
      var col = up ? "#2ebd85" : "#e0524e";
      var cx = X(i);
      out += '<line x1="' + cx.toFixed(1) + '" y1="' + Y(cd.jh).toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + Y(cd.jl).toFixed(1) + '" stroke="' + col + '" stroke-width="1.4"/>';
      var yTop = Y(Math.max(cd.jo, cd.jc)), yBot = Y(Math.min(cd.jo, cd.jc));
      out += '<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + yTop.toFixed(1) + '" width="' + bodyW.toFixed(1) + '" height="' + Math.max(1.4, yBot - yTop).toFixed(1) + '" fill="' + col + '"/>';
      var vy = YV(cd.vol);
      out += '<rect x="' + (cx - bodyW / 2).toFixed(1) + '" y="' + vy.toFixed(1) + '" width="' + bodyW.toFixed(1) + '" height="' + (VT + VH - vy).toFixed(1) + '" fill="' + col + '" opacity="0.55"/>';
    }
    /* moving averages */
    var maDefs = [[5, "#4fc3b8"], [25, "#b7c94e"], [75, "#d98a4a"]];
    maDefs.forEach(function (md) {
      var d = "";
      for (var j = 0; j <= endIdx; j++) {
        var mv = C.maAt(j, md[0]);
        if (mv === null) continue;
        d += (d === "" ? "M" : "L") + X(j).toFixed(1) + "," + Y(mv).toFixed(1) + " ";
      }
      if (d) out += '<path d="' + d + '" fill="none" stroke="' + md[1] + '" stroke-width="1.6" opacity="0.95"/>';
    });
    /* current price dashed line + gold tag */
    var cy = Y(curC.jc);
    out += '<line x1="' + PL + '" y1="' + cy.toFixed(1) + '" x2="' + (PL + PW) + '" y2="' + cy.toFixed(1) + '" stroke="#f2c94c" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.85"/>';
    out += '<rect x="' + (PL + PW + 2) + '" y="' + (cy - 12).toFixed(1) + '" width="' + (AXIS - 6) + '" height="24" rx="5" fill="#f2c94c"/>';
    out += '<text x="' + (PL + PW + 2 + (AXIS - 6) / 2) + '" y="' + (cy + 5).toFixed(1) + '" fill="#231a00" font-size="14" font-weight="800" text-anchor="middle">' + num(curC.jc) + "</text>";
    /* boundary between revealed and undisclosed */
    if (endIdx < total - 1) {
      out += '<line x1="' + bx.toFixed(1) + '" y1="' + PT + '" x2="' + bx.toFixed(1) + '" y2="' + (VT + VH) + '" stroke="rgba(200,212,230,.4)" stroke-width="1.2" stroke-dasharray="5 5"/>';
    }
    /* volume label + dates */
    out += '<text x="' + PL + '" y="' + (VT - 8) + '" fill="#c9a227" font-size="13" font-weight="700">' + esc(L("volume")) + "</text>";
    out += '<text x="' + PL + '" y="' + (VT + VH + 20) + '" fill="#77839a" font-size="12">' + candles[0].date + "</text>";
    out += '<text x="' + X(endIdx).toFixed(1) + '" y="' + (VT + VH + 20) + '" fill="#aeb9c9" font-size="12" text-anchor="middle">' + curC.date + "</text>";
    return out + "</svg>";
  }

  function chartTerminal() {
    var slot = cur();
    var endIdx = C.candleVisibleEnd(slot.round, slot.step);
    var curC = C.NVDA_CANDLES[endIdx];
    var stateLabel = endIdx === C.CANDLE_START_IDX ? L("atStart") : L("atRoundEnd", C.CANDLE_ROUND_ENDS.indexOf(endIdx) + 1);
    function nv(v) { return v.toLocaleString("en-US"); }
    var h = '<div class="term">';
    h += '<div class="term-head"><div><div class="term-name">' + esc(L("candleTitle")) + ' <span class="chip-daily">' + L("dailyChip") + "</span></div>";
    h += '<div><span class="term-price num">' + nv(curC.jc) + '</span><span class="term-state">' + esc(stateLabel) + "</span></div></div>";
    h += '<div class="ohlc">'
      + '<span class="k">' + L("ohlcHigh") + '</span><span class="v num">' + nv(curC.jh) + '</span>'
      + '<span class="k">' + L("ohlcOpen") + '</span><span class="v num">' + nv(curC.jo) + "</span>"
      + '<span class="k">' + L("ohlcLow") + '</span><span class="v num">' + nv(curC.jl) + '</span>'
      + '<span class="k">' + L("ohlcClose") + '</span><span class="v num">' + nv(curC.jc) + "</span>"
      + "</div></div>";
    h += '<div class="ma-legend"><span class="ma1c">' + L("ma1") + '</span><span class="ma2c">' + L("ma2") + '</span><span class="ma3c">' + L("ma3") + '</span><span class="volc">' + L("volume") + "</span></div>";

    h += '<p class="term-note">' + L("chartTitle") + "</p>";

    return h;
  }

  /* ---------- screens ---------- */
  function fmtShares(n) { return (Math.round(n * 100) / 100).toLocaleString("en-US"); }
  function holdingsHTML(cash, shares, price, avgCost) {
    var stockVal = shares * price;
    var total = cash + stockVal;
    var h = '<section class="holdings"><div class="holdings-title">' + L("holdings") + '</div><div class="grid3h">';
    h += '<div><small>' + L("cashStart") + '</small><div class="v">' + fmtYen(cash) + '</div><div class="usdsub">' + fmtUsd(cash) + '</div></div>';
    h += '<div><small>' + L("sharesHeld") + " " + fmtShares(shares) + L("shareUnit") + '</small><div class="v">' + fmtYen(stockVal) + '</div><div class="usdsub">' + fmtUsd(stockVal) + '</div></div>';
    h += '<div class="total"><small>' + L("total") + '</small><div class="v">' + fmtYen(total) + '</div><div class="usdsub">' + fmtUsd(total) + '</div></div>';
    h += '</div><div class="holdings-foot">';
    if (shares > 0 && avgCost) {
      var unreal = shares * (price - avgCost);
      h += '<span>' + L("avgCost") + "：" + fmtPrice(avgCost) + '</span><span>' + L("unrealized") + '：<b class="' + (unreal > 0 ? "pnl-pos" : unreal < 0 ? "pnl-neg" : "") + '">' + fmtSignedYen(unreal) + "</b></span>";
    } else {
      h += '<span>' + L("avgCost") + "：—（" + L("noShares") + "）</span><span>" + L("unrealized") + "：—</span>";
    }
    h += "</div></section>";
    return h;
  }

        h += '<p class="small" style="margin:.9rem 0 .5rem;">' + L("finalTotal") + '：<b class="num">' + fmtYen(slot.result.total) + "</b>｜" + L("pnl") + '：<b class="num ' + (slot.result.pnl > 0 ? "pnl-pos" : slot.result.pnl < 0 ? "pnl-neg" : "") + '">' + fmtSignedYen(slot.result.pnl) + "</b></p>";
        h += '<div class="btn-row"><button type="button" class="btn" data-view-result="' + i + '">' + L("viewResult") + '</button><button type="button" class="btn primary" style="width:auto;" data-again="' + i + '">' + L("again") + "</button></div>";

      } else {
        h += '<div style="margin-top:1rem;"><button type="button" class="btn primary" data-start="' + i + '">' + L("start") + "</button></div>";
      }
      h += "</section>";

      else if (slot0.status === "done") { state.view = "done"; }
      else { startScenario(0); }
      save(); render();
    });
    function bind(attr, fn) {
      Array.prototype.forEach.call(document.querySelectorAll("[" + attr + "]"), function (el) {
        el.addEventListener("click", function () { fn(Number(el.getAttribute(attr))); });
      });
    }
    bind("data-start", function (i) { startScenario(i); });
    bind("data-resume", function (i) { state.current = i; state.view = "play"; if (cur().step === "decide") resetDraft("buy"); save(); render(); });
    bind("data-view-result", function (i) { state.current = i; state.view = "done"; save(); render(); });
    bind("data-again", function (i) { state.slots[i] = freshSlot(); startScenario(i); });
    bind("data-reset", function (i) { openReset(i); });
  }

  function startScenario(i) {
    state.current = i;
    var split = C.initialSplit(C.START_TOTAL);
    var slot = cur();
    slot.sectorIdx = 0;
    slot.cash = split.cash;
    slot.shares = split.shares;
    slot.price = C.BASE_PRICE;
    slot.round = 0; slot.step = "decide"; slot.log = []; slot.lastExec = null; slot.result = null; slot.avgCost = C.BASE_PRICE;
    slot.status = "playing";
    state.view = "play";
    resetDraft("buy");
    save(); render();
  }

  function newsCardHTML(r, withReason) {
    var news = C.SCENARIOS[state.current].news[r];
    var h = '<div class="news-card"><div class="news-kicker">' + L("newsKicker", r + 1) + "｜" + esc(scenShort(state.current)) + "</div>";
    h += '<h2 class="news-head">' + esc(news.headline[state.lang]) + "</h2>";
    if (withReason) h += '<p class="news-body">' + esc(news.reason[state.lang]) + "</p>";
    return h + "</div>";
  }

  function renderPlay() {
    var slot = cur();
    if (slot.step === "executed") { renderExecuted(); return; }
    var r = slot.round;
    var maxBuy = C.maxBuyAmount(slot.cash);
    var maxSell = C.maxSellAmount(slot.shares, slot.price);
    if (draft.action === "buy" && draft.amount > Math.max(maxBuy, 0)) draft.amount = maxBuy >= C.UNIT ? maxBuy : C.UNIT;
    if (draft.action === "sell" && draft.amount > Math.max(maxSell, 0)) draft.amount = maxSell >= C.UNIT ? maxSell : C.UNIT;
    var cantBuy = maxBuy < C.UNIT, cantSell = maxSell < C.UNIT;
    var maxFor = draft.action === "buy" ? maxBuy : maxSell;
    var h = "";
    h += holdingsHTML(slot.cash, slot.shares, slot.price, slot.avgCost);
    h += newsCardHTML(r, false);
    h += chartTerminal();

    h += '<section class="trade-panel"><div class="tp-step">' + L("stepTrade") + '</div><div class="seg2" role="group">';
    var subs = { buy: L("maxWord") + " " + fmtYen(maxBuy), sell: L("maxWord") + " " + fmtYen(maxSell), pass: L("noTrade") };
    ["buy", "sell", "pass"].forEach(function (a) {
      h += '<button type="button" data-action="' + a + '" aria-pressed="' + (draft.action === a) + '"><span class="t">' + L(a) + '</span><span class="s">' + subs[a] + "</span></button>";
    });
    h += "</div>";

    h += '<div class="amt-head"><div><div class="tp-step" style="margin:0;">' + L("stepAmount") + '</div><div class="amt-note">' + L("amountNote") + '</div></div>'
      + '<div class="amt-big num" id="amt-big">' + (draft.action === "pass" ? "—" : amtBigHTML()) + "</div></div>";
    var fillPct = ((draft.amount - C.UNIT) / (C.MAX_TRADE - C.UNIT)) * 100;
    h += '<input type="range" class="amt-slider" id="amt-slider" min="' + C.UNIT + '" max="' + C.MAX_TRADE + '" step="' + C.UNIT + '" value="' + draft.amount + '" style="--fill:' + fillPct + '%" aria-label="' + L("amount") + '" ' + (draft.action === "pass" || maxFor < C.UNIT ? "disabled" : "") + " />";
    h += '<div class="amt-presets">';
    for (var a = C.UNIT; a <= C.MAX_TRADE; a += C.UNIT) {
      h += '<button type="button" data-amount="' + a + '" aria-pressed="' + (draft.amount === a) + '" ' + (draft.action === "pass" || a > maxFor ? "disabled" : "") + ">" + fmtManBtn(a) + "</button>";
    }
    h += "</div>";
    if (draft.action === "buy" && cantBuy) h += '<p class="warn" style="margin:.6rem 0 0;">' + L("cantBuy") + "</p>";
    if (draft.action === "sell" && cantSell) h += '<p class="warn" style="margin:.6rem 0 0;">' + L("cantSell") + "</p>";
    h += '<div class="tp-sum"><div class="kv"><span>' + L("sumAmount") + '</span><b class="num" id="sum-amount">' + (draft.action === "pass" ? "—" : fmtYen(draft.amount)) + '</b></div>'
      + '<div class="kv"><span>' + L("sumDir") + "</span><b>" + L(draft.action) + "</b></div></div>";

    h += '<details class="adv2"><summary>' + L("stepDetail") + (draft.drawdown !== "" ? " -" + esc(draft.drawdown) + "%" : "") + "</summary>";
    h += '<div class="small" style="margin-top:.2rem;">' + L("rationale") + "</div>";
    h += '<div class="radio-list">';
    RATIONALES.forEach(function (o) {
      h += '<label class="radio-chip"><input type="radio" name="rationale" value="' + o.id + '"' + (draft.rationale === o.id ? " checked" : "") + " />" + esc(state.lang === "en" ? o.en : o.ja) + "</label>";
    });
    h += "</div>";
    h += '<label class="small">' + L("advLabel") + ' <input type="number" id="drawdown" min="0" max="100" step="1" inputmode="numeric" placeholder="' + L("advPh") + '" value="' + esc(draft.drawdown) + '" /></label>';
    h += "</details>";
    var confirmDisabled = (draft.action === "buy" && cantBuy) || (draft.action === "sell" && cantSell);
    h += '<button type="button" class="btn primary" id="btn-confirm" ' + (confirmDisabled ? "disabled" : "") + ">" + L("confirmTrade") + "</button>";
    h += '<div class="btn-row" style="margin-top:.7rem;"><button type="button" class="btn ghost" id="btn-home">' + L("homeBtn") + '</button><button type="button" class="btn danger" id="btn-reset">' + L("reset") + "</button></div>";
    h += "</section>";
    app.innerHTML = h;

    Array.prototype.forEach.call(document.querySelectorAll("[data-action]"), function (el) {
      el.addEventListener("click", function () {
        var a = el.getAttribute("data-action");
        draft.action = a; draft.rationale = DEFAULT_RATIONALE[a]; draft.amount = C.UNIT;
        renderPlay(); renderBar();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-amount]"), function (el) {
      el.addEventListener("click", function () {
        draft.amount = Number(el.getAttribute("data-amount"));
        renderPlay(); renderBar();
      });
    });
    var slider = document.getElementById("amt-slider");
    if (slider) slider.addEventListener("input", function () {
      draft.amount = Number(slider.value);
      slider.style.setProperty("--fill", (((draft.amount - C.UNIT) / (C.MAX_TRADE - C.UNIT)) * 100) + "%");
      var big = document.getElementById("amt-big"); if (big) big.innerHTML = amtBigHTML();
      var sum = document.getElementById("sum-amount"); if (sum) sum.textContent = fmtYen(draft.amount);
      Array.prototype.forEach.call(document.querySelectorAll("[data-amount]"), function (b) {
        b.setAttribute("aria-pressed", Number(b.getAttribute("data-amount")) === draft.amount ? "true" : "false");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="rationale"]'), function (el) {
      el.addEventListener("change", function () { draft.rationale = el.value; });
    });
    var dd = document.getElementById("drawdown");
    if (dd) dd.addEventListener("input", function () { draft.drawdown = dd.value; });
    document.getElementById("btn-confirm").addEventListener("click", executeTrade);
    document.getElementById("btn-home").addEventListener("click", function () { state.view = "home"; save(); render(); });
    document.getElementById("btn-reset").addEventListener("click", function () { openReset(state.current); });
  }

  function executeTrade() {
    var slot = cur();
    var r = slot.round;
    var priceBefore = slot.price;
    var action = { type: draft.action, amount: draft.action === "pass" ? 0 : draft.amount };
    var ns = C.applyTrade({ cash: slot.cash, shares: slot.shares, price: priceBefore }, action);
    var rate = C.rateAt(state.current, slot.sectorIdx, r);
    var priceAfter = priceBefore * (1 + rate);
    var entry = {
      round: r, type: action.type, amount: action.amount,
      rationale: draft.rationale, drawdown: draft.drawdown === "" ? null : Number(draft.drawdown),
      priceBefore: priceBefore, priceAfter: priceAfter, rate: rate,
      sharesBefore: slot.shares, sharesAfter: ns.shares,
      cashAfter: ns.cash, valueAfter: ns.shares * priceAfter
    };
    if (action.type === "buy") {
      var baseAvg = slot.avgCost == null ? priceBefore : slot.avgCost;
      slot.avgCost = (slot.shares * baseAvg + action.amount) / (slot.shares + action.amount / priceBefore);
    }
    slot.cash = ns.cash; slot.shares = ns.shares; slot.price = priceAfter;
    slot.log.push(entry); slot.lastExec = entry; slot.step = "executed";
    save(); render();
  }

  function renderExecuted() {
    var slot = cur();
    var e = slot.lastExec;
    var h = "";
    h += holdingsHTML(slot.cash, slot.shares, slot.price, slot.avgCost);
    h += newsCardHTML(e.round, true);
    h += chartTerminal();
    h += '<div class="exec-box"><h3 style="margin-bottom:.5rem;">' + L("execTitle") + "</h3>";
    h += '<div class="kv"><span>' + L("execAction") + "</span><b>" + actionName(e.type) + (e.type !== "pass" ? " " + fmtYen(e.amount) : "") + "</b></div>";
    h += '<div class="kv"><span>' + L("execPrice") + "</span><b class=\"num\">" + fmtPrice(e.priceBefore) + "</b></div>";
    h += '<div class="kv"><span>' + L("execShares") + "</span><b class=\"num\">" + (Math.round(e.sharesAfter * 100) / 100).toLocaleString("en-US") + "</b></div>";
    h += '<div class="kv"><span>' + L("execCash") + "</span><b class=\"num\">" + fmtYen(e.cashAfter) + "</b></div>";
    h += '<div class="kv"><span>' + L("priceMove") + "</span><b class=\"num " + (e.rate > 0 ? "pnl-pos" : e.rate < 0 ? "pnl-neg" : "") + '">' + fmtPrice(e.priceBefore) + " → " + fmtPrice(e.priceAfter) + "（" + fmtPct(e.rate) + "）</b></div>";
    h += '<div class="kv"><span>' + L("moveReason") + "</span><b style=\"max-width:62%;\">" + esc(C.SCENARIOS[state.current].news[e.round].reason[state.lang]) + "</b></div>";
    h += "</div>";
    var isLast = e.round === 2;
    h += '<button type="button" class="btn primary" id="btn-next">' + (isLast ? L("toResult") : L("nextRound")) + "</button>";
    app.innerHTML = h;
    document.getElementById("btn-next").addEventListener("click", function () {
      if (isLast) { finishGame(); }
      else { slot.round += 1; slot.step = "decide"; resetDraft("buy"); save(); render(); }
    });
  }

  function finishGame() {
    var slot = cur();
    var total = slotTotal(slot);
    var bw = C.searchBestWorst(state.current, slot.sectorIdx);
    slot.result = {
      total: total, pnl: total - C.START_TOTAL,
      hold: C.buyAndHold(state.current, slot.sectorIdx),
      best: bw.best.total, worst: bw.worst.total
    };
    slot.cash = total; slot.shares = 0;
    slot.status = "done"; slot.step = "decide";
    state.view = "done";
    save(); render();
  }

  function logLine(e) {
    var s = "R" + (e.round + 1) + "：" + actionName(e.type);
    if (e.type !== "pass") s += " " + fmtYen(e.amount);
    s += "｜" + L("rationale") + "：" + rationaleName(e.rationale);
    if (e.drawdown !== null && e.drawdown !== undefined) s += "｜" + L("drawdown") + "：" + e.drawdown + "%";
    return s;
  }
  function historyLine(e) {
    var s = "R" + (e.round + 1) + "：" + actionName(e.type);
    if (e.type !== "pass") s += " " + fmtYen(e.amount) + " @" + fmtPrice(e.priceBefore);
    s += " → " + fmtPct(e.rate) + "｜" + L("moveReason") + "：" + C.SCENARIOS[state.current].news[e.round].reason[state.lang];
    return s;
  }

  function renderDone() {
    var slot = cur();
    var res = slot.result;
    var diff = res.total - res.hold;
    var maxBar = Math.max(res.total, res.hold, res.best, res.worst);
    function bar(label, val, cls) {
      var w = maxBar > 0 ? Math.max(2, (val / maxBar) * 100) : 0;
      return '<div class="bar-row"><span>' + label + '</span><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + w.toFixed(1) + '%"></div></div><span class="bar-val num">' + fmtYen(val) + "</span></div>";
    }
    var h = '<section class="card gold result-hero"><div class="round-label">' + esc(scenTitle(state.current)) + "｜" + L("resultTitle") + "</div>";
    h += '<div class="result-pnl num ' + (res.pnl > 0 ? "pnl-pos" : res.pnl < 0 ? "pnl-neg" : "") + '" style="margin-top:.4rem;">' + L("pnl") + " " + fmtSignedYen(res.pnl) + "（" + fmtSignedUsd(res.pnl) + "） ／ " + (res.pnl >= 0 ? "+" : "−") + Math.abs(Math.round((res.pnl / C.START_TOTAL) * 1000) / 10) + "%</div>";
    h += '<div class="result-total num">' + L("finalTotal") + "：" + fmtYen(res.total) + ' <span class="muted" style="font-size:.9rem;">' + fmtUsd(res.total) + "</span></div>";
    h += '<p class="muted small">' + sectorName(slot.sectorIdx) + "｜" + L("autoSold") + "</p>";
    h += '<h3 style="text-align:left;margin-top:1rem;">' + L("compare") + "</h3>";
    h += '<div class="bars">';
    h += bar(L("you"), res.total, "you");
    h += bar(L("hold"), res.hold, "");
    h += bar(L("best"), res.best, "best");
    h += bar(L("worst"), res.worst, "worst");
    h += "</div>";
    var cmp = Math.round(diff) === 0 ? L("matched") : diff > 0 ? L("beatHold", fmtYen(diff)) : L("lostHold", fmtYen(-diff));
    h += '<p style="font-weight:700;">' + cmp + "</p>";
    h += "</section>";

    h += '<section class="card"><h3 style="margin-bottom:.4rem;">' + L("decisionLog") + '</h3><ul class="log-list">';
    slot.log.forEach(function (e) { h += "<li>" + esc(logLine(e)) + "</li>"; });
    h += '</ul><h3 style="margin:1rem 0 .4rem;">' + L("history") + '</h3><ul class="log-list">';
    slot.log.forEach(function (e) { h += "<li>" + esc(historyLine(e)) + "</li>"; });
    h += "</ul></section>";

    h += '<div class="promo"><div class="p-title">' + L("promoTitle") + '</div><p style="margin:0;">' + esc(L("promoBody")) + "</p></div>";
    h += '<button type="button" class="btn primary" id="btn-again">' + L("again") + "</button>";
    h += '<div class="btn-row" style="margin-top:.6rem;"><button type="button" class="btn ghost" id="btn-home">' + L("homeBtn") + '</button><button type="button" class="btn danger" id="btn-reset">' + L("reset") + "</button></div>";
    app.innerHTML = h;
    document.getElementById("btn-again").addEventListener("click", function () {
      state.slots[state.current] = freshSlot();
      startScenario(state.current);
    });
    document.getElementById("btn-home").addEventListener("click", function () { state.view = "home"; save(); render(); });
    document.getElementById("btn-reset").addEventListener("click", function () { openReset(state.current); });
  }

  /* ---------- reset modal ---------- */
  var modal = document.getElementById("reset-modal");
  function openReset(scenIdx) {
    pendingReset = scenIdx;
    document.getElementById("reset-title").textContent = L("resetTitle");
    document.getElementById("reset-body").textContent = L("resetBody");
    document.getElementById("reset-yes").textContent = L("resetYes");
    document.getElementById("reset-no").textContent = L("cancel");
    modal.hidden = false;
  }
  function closeReset() { modal.hidden = true; }
  document.getElementById("reset-no").addEventListener("click", closeReset);
  modal.addEventListener("click", function (ev) { if (ev.target === modal) closeReset(); });
  document.getElementById("reset-yes").addEventListener("click", function () {
    state.slots[pendingReset] = freshSlot();
    if (state.current === pendingReset && state.view !== "home") state.view = "home";
    closeReset(); save(); render();
  });

  /* ---------- language ---------- */
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "ja" ? "en" : "ja";
    save(); render();
  });

  function render() {
    renderBar();
    if (state.view === "play") renderPlay();
    else if (state.view === "done") renderDone();
    else renderHome();
  }

  load();
  if (state.view === "play" && cur().step === "decide") resetDraft("buy");
  render();
})();

    </script>
  </body>
</html>
